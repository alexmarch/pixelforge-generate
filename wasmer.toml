[package]
name = "alexmarch/pixelforge-generate"
version = "0.1.0"
description = "Description for package pixelforge-generate"

# See more keys and definitions at https://docs.wasmer.io/registry/manifest
[dependencies]
"mostlywhat/php84" = "*"

#[[module]]
#name = "pixelforge-generate"
#source = "pixelforge-generate.wasm"
#abi = "wasi"

#[module.interfaces]
#wasi = "0.1.0-unstable"

[fs]
"/app" = "."

[[command]]
name = "pixelforge-generate"
module = "mostlywhat/php84:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-S", "0.0.0.0:8080", "-t", "/app/public", "/app/public/index.php"]